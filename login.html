<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Login • Daily Expense Manager Uganda</title>
    <meta name="description" content="Sign in or create an account for Daily Expense Manager Uganda (UGX / USh)." />
    <link rel="icon" type="image/png" href="./assets/icons/icon-192.png" />
    <link rel="stylesheet" href="./style.css?v=3" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: var(--bg-app);
        padding: 1.5rem;
      }
      .login-container {
        width: 100%;
        max-width: 440px;
        background-color: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-lg);
        padding: 2.25rem 2rem;
      }
      .login-brand {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 1.5rem;
        justify-content: center;
      }
      .login-brand img {
        width: 44px;
        height: 44px;
        border-radius: var(--radius-md);
        object-fit: contain;
      }
      .login-brand-title {
        font-size: 1.25rem;
        font-weight: 800;
        color: var(--text-main);
        line-height: 1.2;
      }
      .login-brand-subtitle {
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--primary);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .auth-message-box {
        display: none;
        padding: 0.85rem 1rem;
        border-radius: var(--radius-md);
        font-size: 0.85rem;
        line-height: 1.4;
        margin-bottom: 1.25rem;
        border: 1px solid transparent;
      }
      .auth-message-box.error {
        background-color: var(--accent-red-light, #fee2e2);
        color: var(--accent-red, #dc2626);
        border-color: var(--accent-red, #dc2626);
      }
      .auth-message-box.info {
        background-color: #e0f2fe;
        color: #0369a1;
        border-color: #38bdf8;
      }
      .auth-message-box.success {
        background-color: var(--accent-green-light, #d1fae5);
        color: var(--accent-green, #059669);
        border-color: var(--accent-green, #059669);
      }
      .tab-buttons {
        display: flex;
        background-color: var(--bg-hover);
        padding: 0.25rem;
        border-radius: var(--radius-md);
        margin-bottom: 1.5rem;
      }
      .tab-buttons button {
        flex: 1;
        padding: 0.6rem 0.5rem;
        border: none;
        background: transparent;
        color: var(--text-muted);
        font-size: 0.88rem;
        font-weight: 600;
        border-radius: calc(var(--radius-md) - 2px);
        cursor: pointer;
        transition: all var(--transition-fast);
      }
      .tab-buttons button.active {
        background-color: var(--bg-card);
        color: var(--text-main);
        box-shadow: var(--shadow-sm);
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="login-brand">
        <img src="./assets/logo.png" alt="Daily Expense Manager Logo" />
        <div>
          <div class="login-brand-title">Daily Expense Manager</div>
          <div class="login-brand-subtitle">Uganda • UGX / USh</div>
        </div>
      </div>

      <div class="tab-buttons">
        <button type="button" id="tab-signin" class="active">Sign In</button>
        <button type="button" id="tab-signup">Create Account</button>
      </div>

      <!-- Alert / Info Banner -->
      <div id="auth-error-msg" class="auth-message-box"></div>

      <form id="form-login">
        <div class="form-group" id="group-name" style="display: none; margin-bottom: 1rem;">
          <label class="form-label" for="login-name">Full Name</label>
          <input type="text" id="login-name" placeholder="e.g. Ssekandi Moses" autocomplete="name" />
        </div>

        <div class="form-group" style="margin-bottom: 1rem;">
          <label class="form-label" for="login-email">Email Address *</label>
          <input type="email" id="login-email" placeholder="e.g. name@example.com" required autocomplete="email" />
        </div>

        <div class="form-group" style="margin-bottom: 1.25rem;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem;">
            <label class="form-label" for="login-password" style="margin-bottom: 0;">Password *</label>
            <a href="#" id="link-forgot-password" style="font-size: 0.8rem; color: var(--primary);">Forgot password?</a>
          </div>
          <input type="password" id="login-password" placeholder="Enter your password (min 6 chars)" minlength="6" required autocomplete="current-password" />
        </div>

        <button type="submit" id="login-submit-btn" class="btn-primary" style="width: 100%; justify-content: center; padding: 0.75rem; font-size: 0.95rem;">
          <span>Sign In</span>
        </button>
      </form>

      <div style="margin-top: 1rem;">
        <button type="button" id="google-login-btn" class="btn-secondary" style="width: 100%; justify-content: center; padding: 0.75rem; font-size: 0.95rem;">
          <span style="font-weight: 700; font-size: 1.05rem; line-height: 1;">G</span>
          <span>Continue with Google</span>
        </button>
      </div>

      <div style="margin-top: 1.5rem; text-align: center; font-size: 0.85rem; color: var(--text-muted);">
        <span id="switch-prompt">Don't have an account?</span>
        <a href="#" id="switch-mode-btn" style="color: var(--primary); font-weight: 600; margin-left: 0.25rem;">Create Account</a>
      </div>
    </div>

    <!-- Account Loading Animation Overlay -->
    <div id="login-loading-overlay" class="account-loading-overlay" style="display: none;">
      <div class="account-loading-card">
        <div class="account-loading-logo-wrap">
          <img src="./assets/logo.png" alt="Daily Expense Manager Logo" class="account-loading-logo" />
          <div class="account-loading-spinner-ring"></div>
          <div class="account-loading-pulse-ring"></div>
        </div>
        <h3 class="account-loading-title">Loading your account...</h3>
        <p class="account-loading-subtitle">Welcome back! Preparing your financial dashboard</p>
        <div class="account-loading-progress-bar">
          <div class="account-loading-progress-fill"></div>
        </div>
        <div class="account-loading-step">
          <i data-lucide="shield-check" style="width: 15px; height: 15px;"></i>
          <span>Securing session & loading ledger...</span>
        </div>
      </div>
    </div>

    <!-- Toast container -->
    <div id="toast-container"></div>

    <script type="module">
      import { supabase } from "./supabaseClient.js";

      const APP_BASE = window.location.pathname.split('/').slice(0, -1).join('/') + '/';
      const HOME_URL = APP_BASE + 'index.html';

      async function signIn(email, password, errorElement = "#auth-error-msg", onLoadingCallback = null) {
        const errorContainer = typeof errorElement === "string" ? document.querySelector(errorElement) : errorElement;
        if (errorContainer) {
          errorContainer.textContent = "";
          errorContainer.style.display = "none";
        }

        if (!email || !password) {
          if (errorContainer) {
            errorContainer.textContent = "Please enter both email and password.";
            errorContainer.style.display = "block";
            errorContainer.className = "auth-message-box error";
          }
          return { success: false };
        }

        const { data, error } = await supabase.auth.signInWithPassword({ email, password });

        if (error) {
          if (errorContainer) {
            errorContainer.textContent = error.message;
            errorContainer.style.display = "block";
            errorContainer.className = "auth-message-box error";
          }
          return { success: false, error };
        }

        if (!data?.session) {
          if (errorContainer) {
            errorContainer.textContent = "No active session was returned. Please try again.";
            errorContainer.style.display = "block";
            errorContainer.className = "auth-message-box error";
          }
          return { success: false };
        }

        localStorage.setItem("dem_user_logged_in", "true");
        localStorage.setItem("dem_auth_user", JSON.stringify(data.session.user));

        if (typeof onLoadingCallback === "function") {
          await onLoadingCallback(data.session);
        }

        window.location.replace(HOME_URL);
        return { success: true, data };
      }

      async function signUp(email, password, errorElement = "#auth-error-msg", metadata = {}, onSuccessRedirect = null) {
        const errorContainer = typeof errorElement === "string" ? document.querySelector(errorElement) : errorElement;

        if (!email || !password) {
          if (errorContainer) {
            errorContainer.textContent = "Please provide both email and password.";
            errorContainer.style.display = "block";
            errorContainer.className = "auth-message-box error";
          }
          return { success: false };
        }

        const { data, error } = await supabase.auth.signUp({
          email,
          password,
          options: { data: metadata }
        });

        if (error) {
          if (errorContainer) {
            errorContainer.textContent = error.message;
            errorContainer.style.display = "block";
            errorContainer.className = "auth-message-box error";
          }
          return { success: false, error };
        }

        if (data?.session) await supabase.auth.signOut();

        if (typeof onSuccessRedirect === "function") {
          onSuccessRedirect(email);
        }
        return { success: true, data };
      }

      function initSignInView(emailInputSelector = "#login-email", messageElementSelector = "#auth-error-msg", onModeSwitch = null) {
        const params = new URLSearchParams(window.location.search);
        const email = params.get("email");
        const signupSuccess = params.get("signup") === "success";
        const input = document.querySelector(emailInputSelector);
        const message = document.querySelector(messageElementSelector);

        if (email && input) input.value = email;
        if (signupSuccess && message) {
          if (typeof onModeSwitch === "function") onModeSwitch();
          message.textContent = "Your account has been created. Please check your email and verify your address before logging in.";
          message.style.display = "block";
          message.className = "auth-message-box success";
          window.history.replaceState({}, document.title, window.location.pathname);
        }
      }

      async function signInWithGoogle() {
        const button = document.getElementById("google-login-btn");
        const message = document.getElementById("auth-error-msg");
        if (button) {
          button.disabled = true;
          button.style.opacity = "0.7";
          button.querySelector("span:last-child").textContent = "Connecting to Google...";
        }
        if (message) {
          message.style.display = "none";
          message.textContent = "";
        }

        // For GitHub Pages this preserves the repository path, e.g.
        // https://username.github.io/daily-expense-manager-uganda/index.html
        const redirectTo = window.location.origin + HOME_URL;

        const { error } = await supabase.auth.signInWithOAuth({
          provider: "google",
          options: {
            redirectTo,
            queryParams: {
              access_type: "offline",
              prompt: "select_account"
            }
          }
        });

        if (error) {
          if (message) {
            message.textContent = "Google sign-in could not start: " + error.message;
            message.style.display = "block";
            message.className = "auth-message-box error";
          }
          if (button) {
            button.disabled = false;
            button.style.opacity = "1";
            button.querySelector("span:last-child").textContent = "Continue with Google";
          }
        }
      }

      document.getElementById("google-login-btn")?.addEventListener("click", signInWithGoogle);

      // If a valid Supabase session already exists, go to the dashboard.
      // This uses the repository-safe GitHub Pages URL.
      // 1. If already logged in, redirect immediately to dashboard ("/")
      try {
        const isLoggedIn = localStorage.getItem("dem_user_logged_in") === "true";
        const { data: { session } } = await supabase.auth.getSession();
        if (session || isLoggedIn) {
          window.location.replace(HOME_URL);
        }
      } catch (err) {
        console.warn("Session check warning on login page:", err);
      }

      let isSignUp = false;
      const tabSignIn = document.getElementById("tab-signin");
      const tabSignUp = document.getElementById("tab-signup");
      const groupName = document.getElementById("group-name");
      const submitBtn = document.getElementById("login-submit-btn");
      const switchPrompt = document.getElementById("switch-prompt");
      const switchModeBtn = document.getElementById("switch-mode-btn");
      const errorMsgBox = document.getElementById("auth-error-msg");
      const form = document.getElementById("form-login");
      const forgotLink = document.getElementById("link-forgot-password");

      function setMode(signUpMode) {
        isSignUp = signUpMode;
        if (errorMsgBox) {
          errorMsgBox.textContent = "";
          errorMsgBox.style.display = "none";
        }
        if (isSignUp) {
          tabSignIn.classList.remove("active");
          tabSignUp.classList.add("active");
          groupName.style.display = "block";
          submitBtn.querySelector("span").textContent = "Create Account";
          switchPrompt.textContent = "Already have an account?";
          switchModeBtn.textContent = "Sign In";
          if (forgotLink) forgotLink.style.display = "none";
        } else {
          tabSignUp.classList.remove("active");
          tabSignIn.classList.add("active");
          groupName.style.display = "none";
          submitBtn.querySelector("span").textContent = "Sign In";
          switchPrompt.textContent = "Don't have an account?";
          switchModeBtn.textContent = "Create Account";
          if (forgotLink) forgotLink.style.display = "inline";
        }
      }

      // Check if arriving from a signup redirect with email query params
      initSignInView("#login-email", "#auth-error-msg", () => setMode(false));

      tabSignIn.addEventListener("click", () => setMode(false));
      tabSignUp.addEventListener("click", () => setMode(true));
      switchModeBtn.addEventListener("click", (e) => {
        e.preventDefault();
        setMode(!isSignUp);
      });

      // Handle Form Submit
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("login-email").value.trim();
        const password = document.getElementById("login-password").value;
        const fullName = document.getElementById("login-name").value.trim();

        if (errorMsgBox) {
          errorMsgBox.textContent = "";
          errorMsgBox.style.display = "none";
        }

        submitBtn.disabled = true;
        const originalText = submitBtn.querySelector("span").textContent;
        submitBtn.querySelector("span").textContent = isSignUp ? "Creating Account..." : "Signing In...";

        try {
          if (isSignUp) {
            // After successful signup:
            // - Do NOT auto-login
            // - Redirect user to Sign In view
            // - Keep / pre-fill the email in the form
            // - Show clear success message
            await signUp(
              email,
              password,
              "#auth-error-msg",
              { full_name: fullName },
              (registeredEmail) => {
                setMode(false);
                const emailInput = document.getElementById("login-email");
                if (emailInput) emailInput.value = registeredEmail;
                const passwordInput = document.getElementById("login-password");
                if (passwordInput) passwordInput.value = "";
                if (errorMsgBox) {
                  errorMsgBox.textContent = "Your account has been created. Please check your email and verify your address before logging in.";
                  errorMsgBox.style.display = "block";
                  errorMsgBox.className = "auth-message-box success";
                }
              }
            );
          } else {
            await signIn(email, password, "#auth-error-msg");
          }
        } catch (err) {
          if (errorMsgBox) {
            errorMsgBox.textContent = err.message || "An unexpected error occurred.";
            errorMsgBox.style.display = "block";
            errorMsgBox.className = "auth-message-box error";
          }
        } finally {
          submitBtn.disabled = false;
          submitBtn.querySelector("span").textContent = originalText;
        }
      });

      // Forgot Password
      if (forgotLink) {
        forgotLink.addEventListener("click", async (e) => {
          e.preventDefault();
          const email = document.getElementById("login-email").value.trim();
          if (!email) {
            if (errorMsgBox) {
              errorMsgBox.textContent = "Please enter your email address to reset password.";
              errorMsgBox.style.display = "block";
              errorMsgBox.className = "auth-message-box info";
            }
            return;
          }
          try {
            const { error } = await supabase.auth.resetPasswordForEmail(email);
            if (error) throw error;
            if (errorMsgBox) {
              errorMsgBox.textContent = "Password reset link sent to your email.";
              errorMsgBox.style.display = "block";
              errorMsgBox.className = "auth-message-box success";
            }
          } catch (err) {
            if (errorMsgBox) {
              errorMsgBox.textContent = err.message;
              errorMsgBox.style.display = "block";
              errorMsgBox.className = "auth-message-box error";
            }
          }
        });
      }

      if (window.lucide) window.lucide.createIcons();
    </script>
  </body>
</html>
